<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Time table !!!</title>
  <style>
    body {
      background-color: #1e1e2f;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    input, button {
      font-size: 18px;
      padding: 10px;
      margin: 10px;
      border: none;
      border-radius: 5px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 20px;
    }
    .options {
      margin-top: 20px;
      text-align: center;
    }
    .options label {
      display: block;
      margin: 15px auto;
      font-size: 20px;
    }
    .options input[type=checkbox] {
      transform: scale(1.5);
      margin-right: 10px;
    }
    .leaderboard {
      margin-top: 40px;
      text-align: center;
    }
    table {
      margin: auto;
      border-collapse: collapse;
      width: 60%;
    }
    th, td {
      border: 1px solid #555;
      padding: 8px;
    }
    th {
      background-color: #333;
    }
  </style>
</head>
<body>
  <img src="blackboard.png" alt="Blackboard Logo" class="logo">

  <div id="loginScreen">
    <h1>Enter Your User ID</h1>
    <input type="text" id="userId" placeholder="User ID">
    <button onclick="login()">Login</button>
    <h2 id="welcome"></h2>
    <h3 id="reward"></h3>
  </div>

  <div id="options" class="options" style="display:none;">
    <form id="dailyForm">
      <label><input type="checkbox" name="task" value="1"> <span id="opt1"></span></label>
      <label><input type="checkbox" name="task" value="1"> <span id="opt2"></span></label>
      <label><input type="checkbox" name="task" value="1"> Good Behaviour</label>
      <label><input type="checkbox" name="task" value="1"> Morning Routines</label>
      <button type="button" onclick="submitTasks()">Submit</button>
    </form>
  </div>

  <div class="leaderboard">
    <h2>Leaderboard</h2>
    <table id="leaderboardTable">
      <tr><th>Player ID</th><th>Points</th><th>Rank</th></tr>
    </table>
  </div>

  <script>
    const players = {
      "Achu": {name: "Achu", points: 0},
      "Bikki": {name: "Bikki", points: 0},
      "Bravys": {name: "Bravys", points: 0}
    };

    let currentPlayer = null;

    function randomReward() {
      const rewards = ["🍫 Chocolate", "🍔 Food", "🎁 Gift"];
      return rewards[Math.floor(Math.random() * rewards.length)];
    }

    function loadPoints() {
      const savedData = JSON.parse(localStorage.getItem("playerPoints")) || {};
      const savedMonth = localStorage.getItem("pointsMonth");
      const currentMonth = new Date().getMonth();

      // Reset if month changed
      if (savedMonth == null || parseInt(savedMonth) !== currentMonth) {
        localStorage.setItem("pointsMonth", currentMonth);
        localStorage.setItem("playerPoints", JSON.stringify({}));
        for (let id in players) players[id].points = 0;
        return;
      }

      for (let id in players) {
        if (savedData[id]) players[id].points = savedData[id];
      }
    }

    function savePoints() {
      const data = {};
      for (let id in players) data[id] = players[id].points;
      localStorage.setItem("playerPoints", JSON.stringify(data));
      localStorage.setItem("pointsMonth", new Date().getMonth());
    }

    function canSubmitToday(playerId) {
      const lastSubmit = localStorage.getItem("lastSubmit_" + playerId);
      const today = new Date().toDateString();
      return lastSubmit !== today; // allow only if not submitted today
    }

    function login() {
      const id = document.getElementById("userId").value.trim();
      if (players[id]) {
        currentPlayer = id;
        document.getElementById("welcome").textContent = "Welcome " + players[id].name;
        document.getElementById("reward").textContent = "Reward: " + randomReward();
        document.getElementById("options").style.display = "block";
        document.getElementById("loginScreen").style.display = "none";

        if (id === "Achu") {
          document.getElementById("opt1").textContent = "Daily Chores";
          document.getElementById("opt2").textContent = "Daily Chores (Special)";
        } else {
          document.getElementById("opt1").textContent = "Daily Chores";
          document.getElementById("opt2").textContent = "Daily Studying";
        }
        updateLeaderboard();
      } else {
        document.getElementById("welcome").textContent = "Invalid User ID!";
      }
    }

    function submitTasks() {
      if (!canSubmitToday(currentPlayer)) {
        alert("You already submitted today! Try again tomorrow.");
        return;
      }

      const form = document.getElementById("dailyForm");
      const checked = form.querySelectorAll("input[type=checkbox]:checked");
      if (checked.length > 4) {
        alert("You can only tick up to 4 options per day!");
        return;
      }

      players[currentPlayer].points += checked.length;
      localStorage.setItem("lastSubmit_" + currentPlayer, new Date().toDateString());
      form.reset();
      savePoints();
      updateLeaderboard();

      // Redirect back to start
      document.getElementById("options").style.display = "none";
      document.getElementById("loginScreen").style.display = "block";
      document.getElementById("userId").value = "";
      document.getElementById("welcome").textContent = "";
      document.getElementById("reward").textContent = "";
    }

    function updateLeaderboard() {
      const table = document.getElementById("leaderboardTable");
      table.innerHTML = "<tr><th>Player ID</th><th>Points</th><th>Rank</th></tr>";
      const sorted = Object.entries(players).sort((a,b)=>b[1].points - a[1].points);
      sorted.forEach((p, index) => {
        const row = `<tr><td>${p[0]} (${p[1].name})</td><td>${p[1].points}</td><td>${index+1}</td></tr>`;
        table.innerHTML += row;
      });
    }

    window.onload = () => {
      loadPoints();
      updateLeaderboard();
    };
  </script>
</body>
</html>
