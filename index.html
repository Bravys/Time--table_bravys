<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Time table !!!</title>
  <link rel="icon" type="image/png" href="blackboard.png">
  <style>
    body {
      background-color: #1e1e2f;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    input, button {
      font-size: 18px;
      padding: 10px;
      margin: 10px;
      border: none;
      border-radius: 5px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    .options {
      margin-top: 20px;
      text-align: center;
    }
    .options label {
      display: block;
      margin: 15px auto;
      font-size: 20px;
    }
    .options input[type=checkbox] {
      transform: scale(1.5);
      margin-right: 10px;
    }
    /* Grayed out effect for disabled checkboxes */
    input[type=checkbox]:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .leaderboard {
      margin-top: 40px;
      text-align: center;
    }
    table {
      margin: auto;
      border-collapse: collapse;
      width: 60%;
    }
    th, td {
      border: 1px solid #555;
      padding: 8px;
    }
    th {
      background-color: #333;
    }
  </style>
</head>
<body>
  <div id="loginScreen">
    <h1>Enter Your User ID</h1>
    <h3 id="reward"></h3>
    <input type="text" id="userId" placeholder="User ID">
    <button onclick="login()">Login</button>
    <h2 id="welcome"></h2>
  </div>

  <div id="options" class="options" style="display:none;">
    <form id="dailyForm">
      <label><input type="checkbox" name="task" value="1"> <span id="opt1"></span></label>
      <label><input type="checkbox" name="task" value="1"> <span id="opt2"></span></label>
      <label><input type="checkbox" name="task" value="1"> Good Behaviour</label>
      <label><input type="checkbox" name="task" value="1"> Morning Routines</label>
      <div id="extraOptions"></div>
      <button type="button" onclick="submitTasks()">Submit</button>
    </form>
  </div>

  <div class="leaderboard">
    <h2>Leaderboard</h2>
    <table id="leaderboardTable">
      <tr><th>Player ID</th><th>Points</th><th>Rank</th></tr>
    </table>
  </div>

  <script>
    const players = {
      "Achu": {name: "Achu", points: 1},
      "Unicorn": {name: "Bikki", points: 9},
      "Bravys": {name: "Bravys", points: 11}
    };

    let currentPlayer = null;

    function randomReward() {
      const rewards = ["🍫 Chocolate", "🍔 Food", "🎁 Gift"];
      return rewards[Math.floor(Math.random() * rewards.length)];
    }

    function loadPointsAndReward() {
      const savedData = JSON.parse(localStorage.getItem("playerPoints"));
      const savedMonth = localStorage.getItem("pointsMonth");
      const currentMonth = new Date().getMonth();

      if (savedData) {
        for (let id in players) {
          if (savedData[id]) players[id].points = savedData[id].points;
        }
      }

      if (savedMonth == null || parseInt(savedMonth) !== currentMonth) {
        localStorage.setItem("pointsMonth", currentMonth);
        localStorage.setItem("playerPoints", JSON.stringify(players));
        const reward = randomReward();
        localStorage.setItem("monthlyReward", reward);
      }

      const reward = localStorage.getItem("monthlyReward") || randomReward();
      document.getElementById("reward").textContent = "Reward: " + reward;
    }

    function savePoints() {
      localStorage.setItem("playerPoints", JSON.stringify(players));
      localStorage.setItem("pointsMonth", new Date().getMonth());
    }

    function login() {
      const id = document.getElementById("userId").value.trim();
      if (players[id]) {
        currentPlayer = id;
        document.getElementById("welcome").textContent = "Welcome " + players[id].name;
        document.getElementById("options").style.display = "block";
        document.getElementById("loginScreen").style.display = "none";

        document.getElementById("extraOptions").innerHTML = "";

        if (id === "Achu") {
          document.getElementById("opt1").textContent = "Daily Chores";
          document.getElementById("opt2").textContent = "Daily Chores (Special)";
          addExtraOption("VAVKD", -2);
        } else if (id === "Unicorn") {
          document.getElementById("opt1").textContent = "Daily Chores";
          document.getElementById("opt2").textContent = "Daily Studying";
          addExtraOption("mongi", -1);
        } else if (id === "Bravys") {
          document.getElementById("opt1").textContent = "Daily Chores";
          document.getElementById("opt2").textContent = "Daily Studying";
          addExtraOption("KIMU", -1);
        }

        // Restore disabled state
        const form = document.getElementById("dailyForm");
        form.querySelectorAll("input[type=checkbox]").forEach(box => {
          const labelText = box.nextSibling.textContent.trim();
          if (localStorage.getItem(id + "_disabled_" + labelText) === "true") {
            box.disabled = true;
          }
        });

        updateLeaderboard();
      } else {
        document.getElementById("welcome").textContent = "Invalid User ID!";
      }
    }

    function addExtraOption(label, valueChange) {
      const container = document.getElementById("extraOptions");
      const newLabel = document.createElement("label");
      const newBox = document.createElement("input");
      newBox.type = "checkbox";
      newBox.dataset.valueChange = valueChange;
      newLabel.appendChild(newBox);
      newLabel.appendChild(document.createTextNode(" " + label));
      container.appendChild(newLabel);
    }

    function submitTasks() {
      const form = document.getElementById("dailyForm");
      const checked = form.querySelectorAll("input[type=checkbox]:checked");

      if (checked.length > 4) {
        alert("You can only tick up to 4 options per day!");
        return;
      }

      checked.forEach(box => {
        let change = box.dataset.valueChange ? parseInt(box.dataset.valueChange) : 1;
        players[currentPlayer].points += change;
        box.disabled = true;
        // Save disabled state
        localStorage.setItem(currentPlayer + "_disabled_" + box.nextSibling.textContent.trim(), "true");
      });

      savePoints();
      updateLeaderboard();
      form.reset();

      // Return to login screen
      document.getElementById("options").style.display = "none";
      document.getElementById("loginScreen").style.display = "block";
      document.getElementById("userId").value = "";
      document.getElementById("welcome").textContent = "";
    }

    function updateLeaderboard() {
      const table = document.getElementById("leaderboardTable");
      table.innerHTML = "<tr><th>Player ID</th><th>Points</th><th>Rank</th></tr>";
      const sorted = Object.entries(players).sort((a,b)=>b[1].points - a[1].points);
      sorted.forEach((p, index) => {
        const row = `<tr><td>${p[0]} (${p[1].name})</td><td>${p[1].points}</td><td>${index+1}</td></tr>`;
        table.innerHTML += row;
      });
    }

    window.onload = () => {
      loadPointsAndReward();
      updateLeaderboard();
    };
  </script>
</body>
</html>
